<!DOCTYPE html>
<html lang="es" style="background-color: aliceblue;">
  <head>
    <meta charset="UTF-8" />
    <title>Hablemos</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/emailjs/3.10.0/emailjs.min.js"></script>
    <script type="text/javascript">
      (function() {
        emailjs.init("service_bw3o9ub"); // Usa este ID temporal, reemplázalo con tu ID real de EmailJS
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <h2>Hablemos</h2>
      <div class="contact-img">
        <img src="asets/archivo.gif" alt="Imagen de contacto">
      </div>
      
      <!-- SVG del chat -->
      <svg class="contact-svg" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
        <!-- Fondo del chat -->
        <rect x="20" y="20" width="160" height="110" rx="10" fill="#4a89dc" />
        
        <!-- Burbujas de mensaje -->
        <rect x="35" y="40" width="70" height="20" rx="10" fill="#ffffff" />
        <rect x="35" y="70" width="90" height="20" rx="10" fill="#ffffff" />
        
        <!-- Burbuja del usuario -->
        <rect x="95" y="100" width="70" height="20" rx="10" fill="#e1f5fe" />
        
        <!-- Iconos de envío -->
        <circle cx="170" cy="110" r="10" fill="#4caf50" />
        <path d="M165,110 L170,115 L175,105" stroke="white" stroke-width="2" fill="none" />
      </svg>
      
      <p>¿Tienes alguna pregunta o propuesta? ¡Escríbeme!</p>
      
      <form id="contactForm" class="contact-form">
        <div class="form-group">
          <label for="message">Tu mensaje:</label>
          <textarea id="message" name="message" rows="4" required placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>
        
        <button type="submit" class="submit-btn">Enviar</button>
      </form>
      
      <div id="formStatus" class="form-status"></div>
      
      <a href="index.html" class="link-card">Volver al portafolio</a>
    </div>
    
    <script src="hablemos.js"></script>
  </body>
</html>
